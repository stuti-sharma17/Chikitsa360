{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>AyurAssist</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css"
            crossorigin="anonymous"
        >
        <link
            rel="stylesheet"
            href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"
            crossorigin="anonymous"
        >
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/js/bootstrap.min.js"
            crossorigin="anonymous"
        ></script>
        <link rel="stylesheet" type="text/css" href="{% static 'ai_chat/style.css' %}">
    </head>
    <body>
        <div class="container-fluid h-100">
            <div class="row justify-content-center h-100">
                <div class="col-md-8 col-xl-6 chat">
                    <div class="card">
                        <div class="card-header msg_head">
                            <div class="d-flex bd-highlight">
                                <div class="img_cont">
                                    <img
                                        src="https://www.prdistribution.com/spirit/uploads/pressreleases/2019/newsreleases/d83341deb75c4c4f6b113f27b1e42cd8-chatbot-florence-already-helps-thousands-of-patients-to-remember-their-medication.png"
                                        class="rounded-circle user_img"
                                    >
                                    <span class="online_icon"></span>
                                </div>
                                <div class="user_info">
                                    <span>AyurBot</span>
                                    <p>Ask me anything!</p>
                                </div>
                            </div>
                        </div>
                        <div id="messageFormeight" class="card-body msg_card_body"></div>
                        <div class="card-footer">
                            <form id="messageArea" class="input-group">
                                {% csrf_token %}
                                <input
                                    type="text"
                                    id="text"
                                    name="msg"
                                    placeholder="Type your message..."
                                    autocomplete="off"
                                    class="form-control type_msg"
                                    required
                                >
                                <div class="input-group-append">
                                    <button type="submit" id="send" class="input-group-text send_btn">
                                        <i class="fas fa-location-arrow"></i>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            $(document).ready(function() {
                $("#messageArea").on("submit", function(event) {
                    event.preventDefault();

                    const date = new Date();
                    const hour = date.getHours();
                    const minute = date.getMinutes();
                    const str_time = hour + ":" + minute;
                    const rawText = $("#text").val();
                    const csrfToken = $("input[name=csrfmiddlewaretoken]").val();

                    if (!rawText) {
                        return;
                    }

                    const userHtml = '<div class="d-flex justify-content-end mb-4">' +
                        '<div class="msg_cotainer_send">' +
                        rawText +
                        '<span class="msg_time_send">' +
                        str_time +
                        '</span></div>' +
                        '<div class="img_cont_msg">' +
                        '<img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg">' +
                        '</div></div>';

                    $("#text").val("");
                    $("#messageFormeight").append(userHtml);

                    $.ajax({
                        data: {
                            msg: rawText,
                            csrfmiddlewaretoken: csrfToken
                        },
                        type: "POST",
                        url: "{% url 'chatbot:chatbot_reply' %}"
                    })
                    .done(function(data) {
                        const botHtml = '<div class="d-flex justify-content-start mb-4">' +
                            '<div class="img_cont_msg">' +
                            '<img src="https://www.prdistribution.com/spirit/uploads/pressreleases/2019/newsreleases/d83341deb75c4c4f6b113f27b1e42cd8-chatbot-florence-already-helps-thousands-of-patients-to-remember-their-medication.png" class="rounded-circle user_img_msg">' +
                            '</div><div class="msg_cotainer">' +
                            data +
                            '<span class="msg_time">' +
                            str_time +
                            '</span></div></div>';
                        $("#messageFormeight").append($.parseHTML(botHtml));
                    })
                    .fail(function(xhr) {
                        const errorText = xhr.responseText || "Chatbot error.";
                        const botHtml = '<div class="d-flex justify-content-start mb-4">' +
                            '<div class="img_cont_msg">' +
                            '<img src="https://www.prdistribution.com/spirit/uploads/pressreleases/2019/newsreleases/d83341deb75c4c4f6b113f27b1e42cd8-chatbot-florence-already-helps-thousands-of-patients-to-remember-their-medication.png" class="rounded-circle user_img_msg">' +
                            '</div><div class="msg_cotainer">' +
                            errorText +
                            '<span class="msg_time">' +
                            str_time +
                            '</span></div></div>';
                        $("#messageFormeight").append($.parseHTML(botHtml));
                    });
                });
            });
        </script>
    </body>
</html>
